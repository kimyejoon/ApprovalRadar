$kind: http-request
name: GET Health Check
method: GET
url: 'http://192.168.10.235:8000/'
order: 1000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
